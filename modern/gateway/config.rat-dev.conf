# webircgateway for local testing of the rat client against the DEV IRC network (irc.fuelrats.dev),
# used by compose/docker-compose.rat-dev.yml. Never point this at production IRC. No WEBIRC: the
# dev ircd sees the gateway's own address.
logLevel = 2
identd = false
gateway_name = "fuelratsircgateway-dev"
secret = "$KIWI_GATEWAY_SECRET"

[verify]
required = false

[clients]
realname = "Fuel Rats Kiwi (Rat)"

[server.1]
bind = "0.0.0.0"
port = 7001

[fileserving]
enabled = false

[transports]
websocket
sockjs
kiwiirc

[allowed_origins]
"*://localhost:8099"
"*://127.0.0.1:8099"

[reverse_proxies]
172.16.0.0/12
10.0.0.0/8
192.168.0.0/16
"fd00::/8"

[upstream.1]
hostname = "irc.fuelrats.dev"
port = 6697
tls = true
timeout = 5
throttle = 2
protocol = tcp4

[gateway]
enabled = false
