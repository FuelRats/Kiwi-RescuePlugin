# webircgateway for local/staging testing against the DEV IRC network (irc.fuelrats.dev).
# Never point this at production IRC. No WEBIRC: the dev ircd sees the gateway's own address.
logLevel = 2
identd = false
gateway_name = "fuelratsclients-dev"
secret = "$KIWI_GATEWAY_SECRET"
send_quit_on_client_close = "FuelRats Web IRC - Provided by KiwiIRC"

[verify]
required = false

[clients]
username = "%i"
realname = "%n is using the Client@FuelRats Web client"

[server.1]
bind = "0.0.0.0"
port = 7001

[fileserving]
enabled = false

[transports]
websocket
sockjs
kiwiirc

[allowed_origins]
"*://localhost:8098"
"*://127.0.0.1:8098"

[reverse_proxies]
172.16.0.0/12
10.0.0.0/8
192.168.0.0/16
"fd00::/8"

[upstream.1]
hostname = "irc.fuelrats.dev"
port = 6697
tls = true
timeout = 5
throttle = 2
protocol = tcp4

[gateway]
enabled = false
