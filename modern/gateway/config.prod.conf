# webircgateway for clients.fuelrats.com on irc.us (monterey compose stack).
# Secrets come from the environment: KIWI_GATEWAY_SECRET, KIWI_WEBIRC_PASSWORD.
logLevel = 2
identd = false
gateway_name = "fuelratsclients"
secret = "$KIWI_GATEWAY_SECRET"
send_quit_on_client_close = "FuelRats Web IRC - Provided by KiwiIRC"

[verify]
required = false

[clients]
# Same ident/gecos as the classic client (conf.default_ident '%i', conf.default_gecos).
username = "%i"
realname = "%n is using the Client@FuelRats Web client"

# Plain HTTP on the compose network only; kiwi-web (nginx) is the only caller.
[server.1]
bind = "0.0.0.0"
port = 7001

[fileserving]
enabled = false

[transports]
websocket
sockjs
kiwiirc

[allowed_origins]
"*://clients.fuelrats.com"

# kiwi-web passes a single, trusted X-Forwarded-For entry (see nginx/default.conf.template).
[reverse_proxies]
172.16.0.0/12
10.0.0.0/8
192.168.0.0/16
"fd00::/8"

# unrealircd service on the same compose network. Its webirc block allows 172.18.0.0/16, so the
# connection is forced to IPv4.
[upstream.1]
hostname = "unrealircd"
port = 6667
tls = false
timeout = 5
throttle = 2
webirc = "$KIWI_WEBIRC_PASSWORD"
protocol = tcp4

[gateway]
enabled = false
