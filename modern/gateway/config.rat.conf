# webircgateway for kiwi.fuelrats.com (the rat client) on mozzarella (compose project kiwi-rat).
# Secrets come from the environment: KIWI_GATEWAY_SECRET, KIWI_WEBIRC_PASSWORD.
#
# The upstream is irc.de on 127.0.0.1:6697 over TLS, with WEBIRC through irc.de's 127.0.0.1 webirc
# block. TLS on that link is what gives rats umode +z: UnrealIRCd honours the gateway's `secure`
# tag (set when the browser leg is HTTPS, i.e. X-Forwarded-Proto https from the host nginx) only
# when the gateway-to-server link is TLS, and strips +z otherwise. A plaintext 6667 upstream would
# leave rats without +z.
#
# Origin globs match the whole Origin string, so each host and port the rat client was served
# from needs its own entry: kiwi.fuelrats.com on 443 and 7778, and newkiwi.fuelrats.com on both.
# The host nginx redirects :7778 and newkiwi to the canonical URL, but cached Kiwi 1.5.1 pages on
# those origins keep connecting (through :4443) until that listener is retired.
logLevel = 2
identd = false
gateway_name = "fuelratsircgateway"
secret = "$KIWI_GATEWAY_SECRET"

[verify]
required = false

# Same realname as the native gateway this replaces; the username comes from the client.
[clients]
realname = "Fuel Rats Kiwi (Rat)"

# Plain HTTP on docker0 only (host network); the host nginx is the only caller.
[server.1]
bind = "172.17.0.1"
port = 7003

[fileserving]
enabled = false

[transports]
websocket
sockjs
kiwiirc

[allowed_origins]
"*://kiwi.fuelrats.com"
"*://kiwi.fuelrats.com:7778"
"*://newkiwi.fuelrats.com"
"*://newkiwi.fuelrats.com:7778"

# The host nginx reaches 172.17.0.1:7003 from 172.17.0.1 and passes a single, trusted
# X-Forwarded-For entry plus X-Forwarded-Proto.
[reverse_proxies]
172.16.0.0/12
10.0.0.0/8
192.168.0.0/16
"fd00::/8"

# irc.de on the host network. Its webirc block matches 127.0.0.1 only, so the connection is
# forced to IPv4.
[upstream.1]
hostname = "127.0.0.1"
port = 6697
tls = true
timeout = 5
throttle = 2
webirc = "$KIWI_WEBIRC_PASSWORD"
protocol = tcp4

[gateway]
enabled = false
